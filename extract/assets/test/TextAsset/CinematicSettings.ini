##################   TAAU   ##################
[TAAU@1000]
Enable = 1
Quality = 0
HistoryWeight = 0.95
HistoryWeightInMotion = 0.85
2KSharpenStrength = 0.1
4KSharpenStrength = 0.8

##################   TextureStreaming   ##################
[TextureStreaming@1000]
Enable = 1
Budget = 1024
# Percentage of video memory
BudgetPercent = 0.3
RendererPerFrame = 512

##################   GTAO   ##################
[GTAO@1000]
GTAOEnable = 1
GTAOQualityLevel = 2

##################   RenderTargetSettings   ##################
[RenderTargetSettings@1000]
TransientGBuffer = 0
DepthBits = 32
DepthCombinedWithStencil = 1
CopySceneRTScale = 1
#Config this later for all tiers to cap rendering resolution
MaxResolutionWidth = 15360
RenderingScale = 1
BackBufferResolutionHeight = 8640

##################   Terrain   ######################
[Terrain@1000]
TerrainLODFactor = 1200

##################   Grass   ######################
[Grass@1000]
GrassGlobalSparsity = 1.0

##################   TerrainDeform   ##################
[TerrainDeform@1000]
Enable = 1

##################   ErosionBlend   ##################
[ErosionBlend@1000]
Enable = 1

##################   ContactShadow   ##################
[ContactShadow@1000]
contactShadowEnable = 1

##################   PostProcess   ##################
[PostProcess@1000]
BloomQuality = 2
DepthOfFieldQuality = 0
MotionBlurEnable = 1

##################   Chromatic Aberration   ##################
#设置界面需要独立开关控制

[ChromaticAberration@1000]
ChromaticAberrationEnabled = 1

##################   ShadowMap   ##################
[ShadowMap@1000]
EnableScreenSpaceShadowMask = 1
# CSMShadowMapTileResolution only defines the resolution for single cascade
# Actual atlas resolution is calculated based on this resolution and CSM cascade count
CSMMaxDistance = 200
CSMFadeInnerDistance = 180
CSMTileResolution = 4096

CSMScreenSizeMin0 = 0
CSMScreenSizeMin1 = 0
CSMScreenSizeMin2 = 0
CSMScreenSizeMin3 = 0

CSMEnableOcclusionCulling0 = 0
CSMEnableOcclusionCulling1 = 0
CSMEnableOcclusionCulling2 = 0
CSMEnableOcclusionCulling3 = 0

CharacterShadowMapResolution = 2048
CharacterShadowEnabled = 1
CharacterShadowHardwareBias = 8
CharacterShadowHardwareNormalBias = 0
CharacterShadowShaderBias = 2
CharacterShadowShaderNormalBias = 4

ASMShadowMapTileResolution = 512
ASMMaxDistance = 800.0
ASMScreenSizeMin = 0.001

# Who cares, let's just make it huge!
ASMMaxTileRenderCountPerFrame = 8

PunctualLightShadowEnabled = 1
PunctualLightDynamicCasterCount = 16
PunctualLightTileMaxSize = 2048
PunctualLightForceCullDistance = 1000

##################   Streaming   ##################
[Streaming@1000]
chunkLoadRadius = 160.0
defaultLayerLoadRadius = 128.0
hlodLayerLoadRadius = 1024.0
colliderLayerLoadRadius = 128.0
lightingLayerLoadRadius = 128.0

loadDirtyDistance = 4.0
unloadDirtyDistance = 20.0
loadElapsedMsPerFrame = 5
unloadElapsedMsPerFrame = 5

##################   LODStreaming   ##################
[LODStreaming@1000]
lodStreamingLoadDirtyDistance = 4.0
lodStreamingUnloadDirtyDistance = 20.0

##################   SSR   ##################
[SSR@1000]
ssrEnable= 1
ssrRayMarchingSampleCount = 128
ssrV2 = 0
ssrV2Upsample = 1

##################   FakePR   ##################
[FakePR@1000]
fakePlanarReflectionEnable = 1

##################   Volumetric Fog   ##################
[VolumetricFog@1000]
enableVolumetricFog = 1
gridPixelSize = 8
gridSizeZ = 128
maxSourceRTWidth = 3840
maxSourceRTHeight = 2160
historyMissSuperSampleCount = 16
enablePunctualLightShadow = 0

##################   Light Shaft   ##################
[LightShaft@1000]
enableLightShaft = 1
lightShaftDownSampleFactor = 1.0

##################   Rain   ##################
[RainAndWetness@1000]
EnableRainWetnessHighQuality = 1
RainSplashEnabled = 1
