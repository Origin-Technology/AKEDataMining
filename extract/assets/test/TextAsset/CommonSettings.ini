VignetteEnabled = 1
RadialBlurEnabled = 1
ChromaticAberrationEnabled = 1
DirtyLensEnabled = 1
SharpenEnabled = 1
FrostedGlassEnabled = 1
CutsceneEffectEnabled = 1
FisheyeEffectEnabled = 1
LensFlareEnabled = 1
