# GraphicsFormat.R16G16B16A16_SFloat
LutFormat = 48
# GraphicsFormat.B10G11R11_UFloatPack32
PPBufferFormat = 74
# GraphicsFormat.B10G11R11_UFloatPack32
UIPPBufferFormat = 74

# Features enabled status
