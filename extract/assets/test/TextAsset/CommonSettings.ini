CSMCachedFrame1 = 2
CSMCachedFrame2 = 4
CSMCachedFrame3 = 4
CSMStopRenderCharacterCascade = 2
# Character
CharacterShadowMapResolution = 512
CharacterShadowHardwareBias = 0.0
CharacterShadowHardwareNormalBias = 0.0
CharacterShadowShaderBias = 8.0
CharacterShadowShaderNormalBias = 0.1
