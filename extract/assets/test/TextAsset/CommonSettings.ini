PunctualLightShadowEnabled = 1
PunctualLightTileMaxSize = 512
PunctualLightForceCullDistance = 200
PunctualLightDynamicCasterCount = 4
# ASM
ASMEnabled = 1
ASMShadowMapTileResolution = 128
ASMMaxDistance = 500.0
ASMMaxTileRenderCountPerFrame = 1
